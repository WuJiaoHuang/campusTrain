name: campustrain

x-app-env: &app-env
  TZ: Asia/Shanghai
  JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  NACOS_HOST: nacos
  NACOS_PORT: "8848"
  NACOS_CONFIG_NAMESPACE: ${NACOS_CONFIG_NAMESPACE:-campustrain-dev}
  CAMPUS_ENV: ${CAMPUS_ENV:-dev}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  SENTINEL_DASHBOARD: ${SENTINEL_DASHBOARD:-host.docker.internal:8858}

x-app: &app
  restart: unless-stopped
  networks: [campustrain-net]
  healthcheck:
    test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:$$SERVICE_PORT/actuator/health | grep -q ''"status":"UP"''']
    interval: 20s
    timeout: 8s
    start_period: 600s
    retries: 5

services:
  mysql:
    image: mysql@sha256:ade067ae2fb15eeb6143e81185afe22573e3b3addc58aaf90c41999fa6883991
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_BIND_IP:-127.0.0.1}:3306:3306"
    volumes:
      - campustrain-mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [campustrain-net]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - campustrain-redis-data:/data
    networks: [campustrain-net]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.1.0-slim
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: ${MYSQL_USERNAME:-root}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      JVM_XMS: 384m
      JVM_XMX: 384m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - campustrain-nacos-logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [campustrain-net]
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/8848"']
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 6

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - campustrain-rabbitmq-data:/var/lib/rabbitmq
    networks: [campustrain-net]
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/5672"']
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 6

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.1
    restart: unless-stopped
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${MYSQL_USERNAME:-root}
        --spring.datasource.password=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN in .env}
      TZ: Asia/Shanghai
    ports:
      - "8089:8080"
    volumes:
      - campustrain-xxl-logs:/data/applogs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [campustrain-net]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS -o /dev/null http://127.0.0.1:8080/']
      interval: 20s
      timeout: 8s
      start_period: 90s
      retries: 5

  user-service:
    <<: *app
    build: ./user-service
    environment:
      <<: *app-env
      SERVICE_PORT: "8081"
    depends_on:
      mysql: {condition: service_healthy}
      nacos: {condition: service_healthy}

  auth-service:
    <<: *app
    build: ./auth-service
    environment:
      <<: *app-env
      SERVICE_PORT: "8084"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      mysql: {condition: service_healthy}
      nacos: {condition: service_healthy}
      user-service: {condition: service_healthy}

  training-service:
    <<: *app
    build: ./training-service
    environment:
      <<: *app-env
      SERVICE_PORT: "8082"
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?set OSS_ACCESS_KEY_ID in .env}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?set OSS_ACCESS_KEY_SECRET in .env}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      nacos: {condition: service_healthy}

  enrollment-service:
    <<: *app
    build: ./enrollment-service
    environment:
      <<: *app-env
      SERVICE_PORT: "8083"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      nacos: {condition: service_healthy}
      training-service: {condition: service_healthy}
      user-service: {condition: service_healthy}

  learning-service:
    <<: *app
    build: ./learning-service
    environment:
      <<: *app-env
      SERVICE_PORT: "8087"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      nacos: {condition: service_healthy}
      training-service: {condition: service_healthy}
      enrollment-service: {condition: service_healthy}

  growth-service:
    <<: *app
    build: ./growth-service
    environment:
      <<: *app-env
      SERVICE_PORT: "8088"
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN in .env}
      XXL_JOB_EXECUTOR_ADDRESS: http://growth-service:9998/
      XXL_JOB_LOG_PATH: /data/applogs/xxl-job/executor
    volumes:
      - campustrain-xxl-logs:/data/applogs
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      nacos: {condition: service_healthy}
      xxl-job-admin: {condition: service_healthy}

  community-service:
    <<: *app
    build: ./community-service
    environment:
      <<: *app-env
      SERVICE_PORT: "8090"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      nacos: {condition: service_healthy}
      training-service: {condition: service_healthy}
      enrollment-service: {condition: service_healthy}

  campus-gateway:
    <<: *app
    build: ./campus-gateway
    environment:
      <<: *app-env
      SERVICE_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      nacos: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      training-service: {condition: service_healthy}
      enrollment-service: {condition: service_healthy}

  nginx:
    # CentOS 7 kernel 3.10 blocks newer nginx:alpine pid-file syscall under default seccomp.
    image: nginx:1.24-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      campus-gateway: {condition: service_healthy}
    networks: [campustrain-net]
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/nginx-health | grep -q ok']
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5

networks:
  campustrain-net:
    name: campustrain-net
    driver: bridge

volumes:
  campustrain-mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_DATA_PATH:-/root/mysql/data}
  campustrain-redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-/root/redis/data}
  campustrain-rabbitmq-data:
    external: true
    name: rabbitmq-data
  campustrain-nacos-logs:
  campustrain-xxl-logs:
