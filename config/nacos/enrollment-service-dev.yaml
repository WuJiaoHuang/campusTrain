springdoc:
  packages-to-scan: com.campustrain.enrollmentservice.controller
  paths-to-match: /enrollments/**
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.10.102}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
campustrain:
  enrollment:
    redis:
      host: ${REDIS_HOST:192.168.10.102}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      connect-timeout-ms: ${REDIS_CONNECT_TIMEOUT_MS:3000}
