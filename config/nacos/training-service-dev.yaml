springdoc:
  packages-to-scan: com.campustrain.trainingservice.controller
  paths-to-match: /trainings/**,/courses/**,/chapters/**,/lessons/**,/videos/**

campustrain:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    region: ${OSS_REGION:cn-beijing}
    bucket: ${OSS_BUCKET:java-ai-wujiaohuang}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    upload-expire-seconds: 900
    play-expire-seconds: 600
    max-video-size: 524288000
  training:
    allow-create: true
    fault:
      delay-enabled: false
      delay-ms: 1500
      exception-enabled: false
  cache:
    detail-ttl: 8m
    catalog-ttl: 8m
    null-ttl: 45s
    caffeine-ttl: 45s
    caffeine-maximum-size: 1000
    ttl-jitter: 30s
