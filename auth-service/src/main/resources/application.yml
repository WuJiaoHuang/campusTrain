      discovery:
        server-addr: 192.168.10.102:8848

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.10.102:3306/campus_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
