server:
  port: 8084

spring:
  application:
    name: auth-service

  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
      - "nacos:campustrain-common-${CAMPUS_ENV:dev}.yaml?group=CAMPUS_TRAIN&refreshEnabled=true"
      - "nacos:auth-service-${CAMPUS_ENV:dev}.yaml?group=CAMPUS_TRAIN&refreshEnabled=true"

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:192.168.10.102}:${NACOS_PORT:8848}
      config:
        server-addr: ${NACOS_HOST:192.168.10.102}:${NACOS_PORT:8848}
        namespace: ${NACOS_CONFIG_NAMESPACE:campustrain-dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.10.102}:${MYSQL_PORT:3306}/campus_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}
