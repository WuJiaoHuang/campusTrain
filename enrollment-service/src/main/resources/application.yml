# enrollment-service
server:
  port: 8083

spring:
  application:
    name: enrollment-service

  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
      - "nacos:campustrain-common-${CAMPUS_ENV:dev}.yaml?group=CAMPUS_TRAIN&refreshEnabled=true"
      - "nacos:enrollment-service-${CAMPUS_ENV:dev}.yaml?group=CAMPUS_TRAIN&refreshEnabled=true"

  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.10.102:8858}
      datasource:
        flow:
          nacos:
            server-addr: 192.168.10.102:8848
            namespace: ${NACOS_CONFIG_NAMESPACE:campustrain-dev}
            group-id: CAMPUS_TRAIN
            data-id: enrollment-service-sentinel-flow-${CAMPUS_ENV:dev}.json
            data-type: json
            rule-type: flow
    nacos:
      discovery:
        server-addr: 192.168.10.102:8848
      config:
        server-addr: 192.168.10.102:8848
        namespace: ${NACOS_CONFIG_NAMESPACE:campustrain-dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.10.102:3306/campus_enrollment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123}

  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.10.102}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual

feign:
  sentinel:
    enabled: true

campustrain:
  enrollment:
    redis:
      host: ${REDIS_HOST:192.168.10.102}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      connect-timeout-ms: ${REDIS_CONNECT_TIMEOUT_MS:3000}
