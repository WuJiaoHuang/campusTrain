server:
  port: 8080

spring:
  application:
    name: campus-gateway
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
      - "nacos:campustrain-common-${CAMPUS_ENV:dev}.yaml?group=CAMPUS_TRAIN&refreshEnabled=true"
      - "nacos:campus-gateway-${CAMPUS_ENV:dev}.yaml?group=CAMPUS_TRAIN&refreshEnabled=true"
  cloud:
    sentinel:
      eager: true
      filter:
        enabled: false
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.10.102:8858}
      datasource:
        gateway-flow:
          nacos:
            server-addr: 192.168.10.102:8848
            namespace: ${NACOS_CONFIG_NAMESPACE:campustrain-dev}
            group-id: CAMPUS_TRAIN
            data-id: campus-gateway-sentinel-flow-${CAMPUS_ENV:dev}.json
            data-type: json
            rule-type: gw-flow
    nacos:
      discovery:
        server-addr: 192.168.10.102:8848
      config:
        server-addr: 192.168.10.102:8848
        namespace: ${NACOS_CONFIG_NAMESPACE:campustrain-dev}
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**
            - id: training-service
              uri: lb://training-service
              predicates:
                - Path=/trainings/**,/courses/**,/chapters/**,/lessons/**,/videos/**
            - id: enrollment-service
              uri: lb://enrollment-service
              predicates:
                - Path=/enrollments/**
            - id: learning-service
              uri: lb://learning-service
              predicates:
                - Path=/learning/**
            - id: growth-service
              uri: lb://growth-service
              predicates:
                - Path=/growth/**
            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/community/**

jwt:
  secret: ${JWT_SECRET:development-only-secret-change-me-please-use-env-var-32-bytes-minimum}
